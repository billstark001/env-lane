[package]
name = "env-lane-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
env-lane-core = { path = "../env-lane-core" }
env-lane-plugin-api = { path = "../env-lane-plugin-api" }
serde_json.workspace = true
serde.workspace = true
indexmap.workspace = true
crossterm = "0.29"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
rustix = { version = "1", features = ["process", "termios"] }

[lints]
workspace = true

[features]
plugin-fixture = []

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "env-lane"
path = "src/main.rs"

[[bin]]
name = "env-lane-test-plugin"
path = "tests/fixtures/plugin.rs"
required-features = ["plugin-fixture"]
test = false
