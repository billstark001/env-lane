[workspace]
members = ["crates/env-lane-core", "crates/env-lane-cli", "crates/env-lane-vault"]
resolver = "3"

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
yaml_serde = "0.10.7"
proptest = "1"
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
