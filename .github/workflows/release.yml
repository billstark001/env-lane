name: Release

on:
  push:
    tags:
      - 'v*'
      - '*-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      native: ${{ steps.release.outputs.native }}
      standalone: ${{ steps.release.outputs.standalone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - id: release
        run: pnpm release:verify
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm rust:check

  native:
    needs: verify
    if: needs.verify.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, suffix: darwin-arm64 }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, suffix: darwin-x64 }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, suffix: linux-x64-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, suffix: linux-arm64-gnu }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, suffix: linux-x64-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, suffix: linux-arm64-musl }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, suffix: win32-x64-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, suffix: win32-arm64-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.suffix == 'linux-arm64-musl'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - if: matrix.suffix == 'linux-arm64-musl'
        run: pnpm --filter @env-lane/native exec napi build --cwd . --manifest-path ../../Cargo.toml --package env-lane-node --platform --release --target ${{ matrix.target }} --output-dir . --cross-compile
      - if: matrix.suffix != 'linux-arm64-musl'
        run: pnpm --filter @env-lane/native exec napi build --cwd . --manifest-path ../../Cargo.toml --package env-lane-node --platform --release --target ${{ matrix.target }} --output-dir .
      - run: cargo build --release --locked --target ${{ matrix.target }} -p env-lane-cli
      - run: cargo build --release --locked --target ${{ matrix.target }} -p env-lane-plugin-vault
      - run: node scripts/native-release.mjs stage ${{ matrix.target }}
      - run: node scripts/verify-native-artifact.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.suffix }}
          path: native-artifacts/native-${{ matrix.suffix }}/
          if-no-files-found: error

  publish:
    needs: [verify, native]
    if: ${{ always() && needs.verify.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: pnpm release:verify
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: needs.verify.outputs.native == 'true'
        with:
          pattern: native-*
          path: native-artifacts
      - if: needs.verify.outputs.native == 'true'
        run: node scripts/native-release.mjs prepare
      - run: pnpm release

  standalone-release:
    needs: [verify, native, publish]
    if: needs.verify.outputs.standalone == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts
      - run: node scripts/prepare-standalone-release.mjs
      - run: sha256sum -c SHA256SUMS
        working-directory: release-files
      - name: Smoke test the standalone archive after artifact download
        run: |
          mkdir standalone-smoke
          tar -xzf release-files/env-lane-linux-x64-gnu.tar.gz -C standalone-smoke
          test -x standalone-smoke/plugins/@env-lane/vault-native-linux-x64-gnu/env-lane-plugin-vault
          standalone-smoke/env-lane --version
      - run: gh release create "$GITHUB_REF_NAME" release-files/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
